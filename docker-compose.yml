version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: maet-postgres
    environment:
      POSTGRES_DB: maet_terminal
      POSTGRES_USER: maet
      POSTGRES_PASSWORD: maet_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: maet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
