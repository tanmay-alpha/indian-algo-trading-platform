name: Keep Render backend warm

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping MAET backend
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://maet-backend.onrender.com/ping || echo "000")
          echo "Backend responded with HTTP $STATUS"
          if [ "$STATUS" = "000" ]; then echo "Backend warming up - cold start expected"; fi
