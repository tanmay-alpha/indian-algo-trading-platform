name: Fullstack CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest

    env:
      CI: "true"
      APP_ENV: test
      TRADING_MODE: PAPER
      PAPER_TRADING: "true"
      BROKER_ENABLED: "false"
      ENABLE_BROKER_LOGIN: "false"
      SKIP_BROKER_LOGIN: "true"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend

      # Safe CI-only dummy values. Never use real broker credentials in CI.
      ANGEL_API_KEY: dummy_api_key
      ANGEL_CLIENT_ID: dummy_client_id
      ANGEL_CLIENT_CODE: dummy_client_code
      ANGEL_PASSWORD: dummy_password
      ANGEL_TOTP_SECRET: JBSWY3DPEHPK3PXP
      DATABASE_URL: sqlite:///./ci_test.db
      JWT_SECRET_KEY: ci-only-jwt-secret-key-for-auth-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
          pip install pytest pytest-asyncio

      - name: Compile backend
        run: python -m compileall backend

      - name: Run backend tests
        run: pytest -q -ra

  frontend-checks:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend
        run: npm run build
