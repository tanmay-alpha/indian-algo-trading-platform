name: Deploy to Render (auto-trigger)

# Auto-trigger Render redeploys when changes land on main.
#
# Render Deploy Hooks (https://api.render.com/deploy/srv-XXX?key=YYY) are
# service-specific URLs that cause Render to pull the latest commit and
# rebuild. We fire the hook from CI so GitHub → Render stays in sync
# without the user needing to click "Manual Deploy" in the dashboard.
#
# Required GitHub secret:
#   RENDER_DEPLOY_HOOK_URL
#     The Deploy Hook URL from the Render dashboard:
#       Dashboard -> maet-backend -> Settings -> Deploy Hook
#     Store it as a repo or org secret. NEVER commit it.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional reason for manual trigger"
        required: false
        default: "manual trigger from GitHub Actions"

jobs:
  trigger-render-deploy:
    name: Ping Render Deploy Hook
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify deploy hook secret is configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set."
            echo "Add it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "Get the value from: Render Dashboard -> maet-backend -> Settings -> Deploy Hook"
            exit 1
          fi
          echo "Deploy hook URL is configured (length=${#RENDER_DEPLOY_HOOK_URL})"

      - name: Trigger Render redeploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          TRIGGER_REASON: ${{ github.event.head_commit.message || github.event.inputs.reason || 'auto-triggered by CI' }}
        run: |
          echo "Triggering Render deploy: $TRIGGER_REASON"
          HTTP_STATUS=$(curl -s -o /tmp/render_response.txt -w "%{http_code}" \
            -X POST \
            -H "Accept: application/json" \
            "$RENDER_DEPLOY_HOOK_URL")
          echo "Render responded with HTTP $HTTP_STATUS"
          cat /tmp/render_response.txt 2>/dev/null || true

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ] && [ "$HTTP_STATUS" != "202" ]; then
            echo "::error::Render deploy hook returned unexpected status $HTTP_STATUS"
            exit 1
          fi

          echo "Render deploy triggered successfully. Watch progress at:"
          echo "  https://dashboard.render.com/web/${{ github.repository }}"

      - name: Wait for Render to start the build
        env:
          BACKEND_URL: https://maet-backend.onrender.com
        run: |
          # Render's free tier can take several minutes for a cold start or a
          # build from scratch. We poll /ping for up to the job timeout
          # (~10 min) so we don't cancel mid-build. We treat HTTP 200 as the
          # success condition; HTTP 000/502/503/etc. simply mean "not ready
          # yet" and we keep retrying until the job timeout kicks in.
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            sleep 15
            STATUS=$(curl -sS -L --connect-timeout 10 --max-time 20 \
              -o /dev/null -w "%{http_code}" \
              "$BACKEND_URL/ping" 2>/dev/null || echo "000")
            echo "Attempt ${attempt}: GET $BACKEND_URL/ping -> HTTP ${STATUS}"
            if [ "$STATUS" = "200" ]; then
              echo "Backend is live. Auto-deploy verified."
              exit 0
            fi
          done
