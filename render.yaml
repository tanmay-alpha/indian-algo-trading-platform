services:
  - type: web
    name: maet-backend
    # Modern Render schema: "env" replaces the deprecated "runtime" field.
    # The old `runtime: python` key still works but is no longer the
    # recommended path; using `env` ensures env vars from this file are
    # injected into the process at boot.
    env: python
    plan: free
    # Render runs the build and start commands with this directory as cwd.
    # We keep rootDir at the repo root so the standard "backend.api_server:app"
    # module path works without any PYTHONPATH gymnastics. The build/install
    # path below points into backend/ where the package actually lives.
    rootDir: .
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    # ${PORT:-10000} provides a defensive fallback in case Render's $PORT env
    # var is ever unset or stripped during a shell pass. Render's docs state
    # that the default PORT is 10000, so this matches the platform default.
    startCommand: "uvicorn backend.api_server:app --host 0.0.0.0 --port ${PORT:-10000} --workers 1 --log-level info"
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      # PYTHONPATH explicit so the `backend` package is importable from
      # any cwd (rootDir is "." but the start command might still resolve
      # things differently from build to start time).
      - key: PYTHONPATH
        value: "."
      # Use DEMO instead of PRODUCTION to avoid the PostgreSQL requirement
      # in the validator. The free tier doesn't have a managed Postgres,
      # so we run in DEMO mode which allows SQLite. This is also semantically
      # correct (a demo-tier deploy isn't a "production" environment).
      - key: ENVIRONMENT
        value: DEMO
      - key: TRADING_MODE
        value: PAPER
      - key: PAPER_TRADING
        value: "true"
      - key: BROKER_ENABLED
        value: "false"
      - key: ENABLE_BROKER_LOGIN
        value: "false"
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://indian-algo-trading-platform.vercel.app
      # ---- Secrets (rotate in the Render dashboard before going live) ----
      # All values below are placeholders so the container can boot on the
      # free tier. The .env file is gitignored, so without these the Settings
      # pydantic model crashes at import time with "field required" for the
      # angel_* creds. In paper/demo mode these values are not actually used
      # to talk to the broker — the live_trading_enabled=False gate in
      # config_validation.validate_broker_config keeps them inert.
      - key: JWT_SECRET_KEY
        value: dev-jwt-secret-render-placeholder-rotate-32chars
      - key: ADMIN_TOKEN
        value: dev-admin-token-render-placeholder-rotate-32chars
      - key: ANGEL_API_KEY
        value: render-placeholder-angel-api-key-do-not-use
      - key: ANGEL_CLIENT_ID
        value: render-placeholder-client-id
      - key: ANGEL_PASSWORD
        value: render-placeholder-angel-password
      - key: ANGEL_TOTP_SECRET
        value: RENDERPLACETOTPSECRETDONOTUSE
      # ---- Production data store (optional — falls back to SQLite path) ----
      # Uncomment and set DATABASE_URL to a Postgres URL in the Render
      # dashboard to enable persistent storage. SQLite is the default if
      # unset; the platform runs fine on it for demo/paper mode.
      # - key: DATABASE_URL
      #   value: postgresql://user:pass@host/db
      #
      # ---- Prompt 2: Dual-source market data (Yahoo + Angel + Supabase cache) ----
      # Optional: Angel One live data — uncomment and set these to get
      # real-time ticks (requires Angel One dashboard credentials):
      # - key: ANGEL_API_KEY
      #   value: your-angel-api-key
      # - key: ANGEL_CLIENT_ID
      #   value: your-angel-client-id
      # - key: ANGEL_PASSWORD
      #   value: your-angel-pin
      # - key: ANGEL_TOTP_SECRET
      #   value: base32encodedtotpsecret
      #
      # Optional: Supabase caching — uncomment and set these to persist
      # candle history in your own database (run 001_candles.sql first):
      # - key: SUPABASE_URL
      #   value: https://your-project.supabase.co
      # - key: SUPABASE_KEY
      #   value: your-supabase-public-key
