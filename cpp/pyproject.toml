# Build system configuration for the C++ extension module.
# This file enables building the `maet_cpp_indicators` Python extension
# using scikit-build-core and pybind11, which is the recommended approach
# for modern C++ extension distribution. It adds scikit-build-core and pybind11
# as build requirements and sets up the package metadata.

[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "maet_cpp_indicators"
version = "0.1.0"
requires-python = ">=3.8"
description = "MAET C++ numerical indicators for Python"
authors = [
    {name = "Tanmay Sharma", email = "tanmay@example.com"},
]
keywords = ["trading", "indicators", "technical", "c++", "numpy", "analysis"]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/tanmay-alpha/indian-algo-trading-platform"
Repository = "https://github.com/tanmay-alpha/indian-algo-trading-platform"
Issues = "https://github.com/tanmay-alpha/indian-algo-trading-platform/issues"
Documentation = "https://github.com/tanmay-alpha/indian-algo-trading-platform"

# Optional: if you want to install the extension to the system when building locally.
# For now this is for reference only; the build is triggered by
# the scripts/build_cpp_indicators.py helper script from the parent directory.
[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = ["."]  # needed because the extension is not in a setup.py
cmake.define = {CMAKE_BUILD_TYPE="Release"}
cmake.minimum-required-version = "3.15"
cmake.targets = ["maet_cpp_indicators"]